server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité de base.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    # Sonde de santé du conteneur.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Relais vers l'API : le navigateur ne parle qu'à une seule origine (pas de CORS).
    # Le nom « api » est résolu par le DNS de Docker Compose (ou du Service Kubernetes).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les fichiers générés par Vite portent un hash dans leur nom : cache longue durée sans risque.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre route renvoie index.html (jamais mis en cache).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
